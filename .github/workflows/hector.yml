name: Héctor — vigía de precios

# (codex) Cuatro shards independientes: más CPU, estados SQLite sin escrituras
# cruzadas y una base consolidada al final para redes/análisis.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      solo_descubrir:
        description: "Solo repoblar el catálogo"
        type: boolean
        default: false
      barrida_completa:
        description: "Forzar la barrida completa"
        type: boolean
        default: false
      limpiar_pum:
        description: "Sacar precios por unidad de medida"
        type: boolean
        default: false

concurrency:
  group: hector-barrida
  cancel-in-progress: false

jobs:
  vigilar:
    name: Shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - shard: "0"
            tiendas: "falabella.com,easy.cl,casaideas.cl,wei.cl,crandon.cl,kmarket.cl,buscalibre.cl"
          - shard: "1"
            tiendas: "hites.com,farmaciasahumada.cl,doite.cl,vans.cl,reuse.cl,jumbo.cl,dinsa.cl,dafiti.cl,converse.cl,mall.cl,dijon.com"
          - shard: "2"
            tiendas: "tricot.cl,santaisabel.cl,spdigital.cl,underarmour.cl,hushpuppies.cl,sportline.cl,adidas.cl,tecnored.cl,abc.cl,preunic.cl,pcfactory.cl,reifschneider.cl"
          - shard: "3"
            tiendas: "salcobrand.cl,construmart.cl,bata.cl,antartica.cl,puma.cl,paris.cl,rosen.cl,winnerchile.cl,tottus.cl,homy.cl,ripley.cl,cruzverde.cl,decathlon.cl,apple.com/cl"
    permissions:
      contents: read
      actions: read

    steps:
      - name: Traer el código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Recuperar la base más reciente del shard
        env:
          GH_TOKEN: ${{ github.token }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          NAME="precios-db-$SHARD"
          ARTIFACT_ID=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=$NAME&per_page=20" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].id // empty')
          if [ -z "$ARTIFACT_ID" ]; then
            echo "sin base del shard; migrando desde la base monolítica"
            ARTIFACT_ID=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=precios-db&per_page=20" \
              --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].id // empty')
          fi
          if [ -n "$ARTIFACT_ID" ]; then
            gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/precios.zip
            unzip -o /tmp/precios.zip -d .
            echo "base recuperada: $(du -h precios.db | cut -f1)"
          else
            echo "sin base previa; se descubrirá el catálogo del shard"
          fi

      - name: Aislar la base del shard
        if: hashFiles('precios.db') != ''
        env:
          HECTOR_TIENDAS: ${{ matrix.tiendas }}
        run: python -u particionar_base.py

      - name: Limpiar precios por unidad de medida
        if: github.event.inputs.limpiar_pum == 'true' && hashFiles('precios.db') != ''
        run: python -u limpiar_pum.py --confirmar

      - name: Correr Héctor
        env:
          HECTOR_SHARD: ${{ matrix.shard }}
          HECTOR_TIENDAS: ${{ matrix.tiendas }}
          HECTOR_FACTOR_RITMO: ${{ vars.HECTOR_FACTOR_RITMO }}
          HECTOR_PROCESOS_PARSE: "3"
          HECTOR_SOLO_DESCUBRIR: ${{ github.event.inputs.solo_descubrir == 'true' && '1' || '0' }}
          HECTOR_BARRIDA_COMPLETA: ${{ github.event.inputs.barrida_completa == 'true' && '1' || '0' }}
          HECTOR_PROXY_URL: https://hector-proxy-tiendas.contacto-e95.workers.dev
          HECTOR_PROXY_TOKEN: ${{ secrets.HECTOR_PROXY_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          VIGIA_CHAT_ID: ${{ secrets.VIGIA_CHAT_ID }}
          VIGIA_TOPICO_ERRORES: ${{ vars.VIGIA_TOPICO_ERRORES }}
          VIGIA_TOPICO_OFERTAS: ${{ vars.VIGIA_TOPICO_OFERTAS }}
          VIGIA_TOPICO_ELECTRONICOS: ${{ vars.VIGIA_TOPICO_ELECTRONICOS }}
          VIGIA_TOPICO_HOGAR: ${{ vars.VIGIA_TOPICO_HOGAR }}
        run: python -u correr.py

      - name: Guardar estado del shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: precios-db-${{ matrix.shard }}
          path: precios.db
          retention-days: 2
          if-no-files-found: warn
          overwrite: true

  consolidar:
    name: Consolidar estado y respaldar
    needs: vigilar
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: write
    steps:
      - name: Traer el código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar los cuatro shards de esta corrida
        uses: actions/download-artifact@v4
        with:
          pattern: precios-db-*
          path: shards

      - name: Consolidar bases
        run: python -u combinar_bases.py --entrada shards --salida precios.db

      - name: Publicar base compatible con redes y análisis
        uses: actions/upload-artifact@v4
        with:
          name: precios-db
          path: precios.db
          retention-days: 2
          if-no-files-found: error
          overwrite: true

      - name: Respaldo diario persistente
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view respaldo-base >/dev/null 2>&1 || \
            gh release create respaldo-base --title "Respaldo de la base de precios" \
              --notes "Respaldo diario consolidado de los cuatro shards de Héctor." --latest=false
          ULTIMO=$(gh api "repos/${{ github.repository }}/releases/tags/respaldo-base" \
            --jq '[.assets[] | select(.name == "precios.db")][0].updated_at // ""')
          if [[ "$ULTIMO" == "$(date -u +%F)"* ]]; then
            echo "el respaldo de hoy ya existe"; exit 0
          fi
          gh release upload respaldo-base precios.db --clobber

      - name: Conservar solo los dos artifacts más recientes por estado
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for NAME in precios-db-0 precios-db-1 precios-db-2 precios-db-3 precios-db; do
            gh api "repos/${{ github.repository }}/actions/artifacts?name=$NAME&per_page=100" \
              --jq '.artifacts | sort_by(.created_at) | reverse | .[2:] | .[].id' | \
            while read -r ID; do
              [ -z "$ID" ] || gh api --method DELETE \
                "repos/${{ github.repository }}/actions/artifacts/$ID"
            done
          done
