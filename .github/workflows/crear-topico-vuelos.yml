name: Crear tópico Vuelos (una sola vez)

# Job chico, de un solo uso: crea el tópico "✈️ Ofertas Vuelos" en el grupo
# de Rat.IA. No toca los tópicos que ya existen. Se puede borrar este
# archivo después de correrlo.

on:
  workflow_dispatch: {}

jobs:
  crear:
    runs-on: ubuntu-latest
    steps:
      - name: Crear el tópico
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          VIGIA_CHAT_ID: ${{ secrets.VIGIA_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["VIGIA_CHAT_ID"]

          req = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/createForumTopic",
              data=json.dumps({
                  "chat_id": chat_id,
                  "name": "✈️ Ofertas Vuelos",
                  "icon_color": 0x1E90FF,
              }).encode(),
              headers={"Content-Type": "application/json"})
          r = json.loads(urllib.request.urlopen(req, timeout=30).read().decode())
          print(json.dumps(r, indent=2, ensure_ascii=False))
          if r.get("ok"):
              tid = r["result"]["message_thread_id"]
              print("\n" + "=" * 50)
              print("VIGIA_TOPICO_VUELOS=%s" % tid)
              print("=" * 50)
          PY
