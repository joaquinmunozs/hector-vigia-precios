name: Sonda — ¿qué ve el runner?

# Diagnóstico, no producción. Solo a mano.
#
# Existe porque el 11-ago-2026 el descubrimiento dio 0 fichas para paris.cl,
# easy.cl y otras 8 tiendas, mientras que desde la conexión de Joaquín esas
# mismas tiendas responden en menos de un segundo. Antes de pagar un proxy o
# montar nada en otro proveedor, hay que saber QUÉ contesta la tienda cuando
# le pregunta el runner: un 403 no se arregla con el mismo tipo de servidor.
on:
  workflow_dispatch:
    inputs:
      dominios:
        description: "Dominios a sondear, separados por coma"
        required: false
        default: "paris.cl,easy.cl"

jobs:
  sondear:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # Prueba el camino REAL: `descubrir.fichas_de` con el proxy encendido,
      # que es exactamente lo que corre en producción. No sirve probar solo
      # que el Worker contesta — hay que ver que Héctor saque fichas.
      - name: Descubrir por el proxy (paris y easy)
        env:
          HECTOR_PROXY_URL: https://hector-proxy-tiendas.contacto-e95.workers.dev
          HECTOR_PROXY_TOKEN: ${{ secrets.HECTOR_PROXY_TOKEN }}
        run: |
          python - <<'PY'
          import sys
          sys.stdout.reconfigure(encoding="utf-8")
          import descubrir
          print("proxy configurado:", bool(descubrir.PROXY_URL and descubrir.PROXY_TOKEN))
          for dom in ("paris.cl", "easy.cl"):
              try:
                  urls = descubrir.fichas_de(dom, tope=60)
                  print("%-10s %d fichas" % (dom, len(urls)))
                  for u in urls[:3]:
                      print("     ", u[:100])
              except Exception as e:
                  print("%-10s ERROR %s" % (dom, str(e)[:120]))
          PY

      # Lee FICHAS REALES de a una, con pausa entre medio. Es la prueba que
      # separa "nos bloquean" de "se ahogan bajo carga" — la misma que en el
      # §6 de la bitácora del 11-ago demostró que spdigital no estaba
      # bloqueada: 18 de 20 URLs "fallidas" leyeron bien de a una.
      #
      # Si de a una responde 200, el problema es el RITMO y se arregla en
      # RITMO_SEGURO. Si de a una ya responde 403, bajar el ritmo no sirve
      # de nada y hay que ir por el proxy.
      - name: Leer fichas de a una (¿bloqueo o carga?)
        env:
          DOMINIOS: ${{ inputs.dominios }}
          HECTOR_PROXY_URL: https://hector-proxy-tiendas.contacto-e95.workers.dev
          HECTOR_PROXY_TOKEN: ${{ secrets.HECTOR_PROXY_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import sys
          import time
          sys.stdout.reconfigure(encoding="utf-8")
          import descubrir
          from curl_cffi import requests as cffi

          try:
              ip = cffi.get("https://api.ipify.org", timeout=20).text
          except Exception as e:
              ip = "? (%s)" % str(e)[:40]
          print("IP de salida del runner:", ip, "\n")

          doms = [d.strip() for d in (os.environ.get("DOMINIOS") or "").split(",")
                  if d.strip()]

          for dom in doms:
              print("=" * 66)
              print(dom)
              print("=" * 66)
              try:
                  urls = descubrir.fichas_de(dom, tope=40)
              except Exception as e:
                  print("  no se pudieron descubrir fichas: %s\n" % str(e)[:120])
                  continue
              print("  fichas descubiertas: %d" % len(urls))
              muestra = urls[:10]
              if not muestra:
                  print()
                  continue

              # Se miden LOS DOS CAMINOS a propósito:
              #
              #   directo -> `cffi.get`, que es lo que ve la tienda desde la
              #              IP del runner
              #   real    -> `descubrir.bajar`, que es POR DONDE SALEN todas
              #              las peticiones de Héctor y donde se aplica el
              #              proxy si la tienda está en POR_PROXY
              #
              # Medir solo el directo fue un error el 12-ago: daba 403 para
              # tottus incluso ya estando el proxy puesto, porque el proxy no
              # participaba de la prueba. Una sonda que no usa el camino real
              # no prueba nada.
              via_proxy = getattr(descubrir, "_por_proxy", None)
              usa_proxy = False
              if via_proxy:
                  destino, _ = via_proxy(muestra[0])
                  usa_proxy = destino != muestra[0]
              print("  ¿esta tienda va por el proxy?: %s\n"
                    % ("SÍ" if usa_proxy else "no"))

              directo, real = {}, {"ok": 0, "falla": 0}
              for u in muestra:
                  try:
                      r = cffi.get(u, impersonate="chrome", timeout=30,
                                   headers={"Accept-Language": "es-CL,es;q=0.9"})
                      directo[r.status_code] = directo.get(r.status_code, 0) + 1
                      cod = str(r.status_code)
                  except Exception as e:
                      directo["ERR"] = directo.get("ERR", 0) + 1
                      cod = "ERR"

                  # El camino real. Se mira el TAMAÑO además del éxito: una
                  # página de bloqueo también devuelve 200 y pesa 6 KB.
                  try:
                      html = descubrir.bajar(u, tiempo=30) or ""
                      bien = len(html) > 20000
                      real["ok" if bien else "falla"] += 1
                      marca = "%6d KB %s" % (len(html) // 1024,
                                             "OK" if bien else "flaca")
                  except Exception as e:
                      real["falla"] += 1
                      marca = "ERROR %s" % str(e)[:30]

                  print("    directo:%-5s  real:%-18s %s" % (cod, marca, u[:52]))
                  time.sleep(1.2)   # de a una y sin apuro: ese es el punto

              print("\n  directo: %s" % directo)
              print("  por el camino real: %s" % real)
              if real["ok"] == len(muestra):
                  if usa_proxy:
                      print("  → EL PROXY LO RESUELVE. Queda vigilada.\n")
                  else:
                      print("  → LEE PERFECTO de a una y sin proxy. El problema "
                            "es el RITMO:\n    bajar su valor en RITMO_SEGURO.\n")
              elif real["ok"] == 0:
                  print("  → NO lee ni de a una por el camino real. Si ya va "
                        "por el proxy,\n    el proxy no alcanza para esta "
                        "tienda.\n")
              else:
                  print("  → mixto (%d/%d): mirar la columna real.\n"
                        % (real["ok"], len(muestra)))
          PY
