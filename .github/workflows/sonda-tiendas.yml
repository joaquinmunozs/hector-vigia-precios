name: Sonda — ¿qué ve el runner?

# Diagnóstico, no producción. Solo a mano.
#
# Existe porque el 11-ago-2026 el descubrimiento dio 0 fichas para paris.cl,
# easy.cl y otras 8 tiendas, mientras que desde la conexión de Joaquín esas
# mismas tiendas responden en menos de un segundo. Antes de pagar un proxy o
# montar nada en otro proveedor, hay que saber QUÉ contesta la tienda cuando
# le pregunta el runner: un 403 no se arregla con el mismo tipo de servidor.
on:
  workflow_dispatch:
    inputs:
      dominios:
        description: "Dominios a sondear, separados por coma"
        required: false
        default: "paris.cl,easy.cl"

jobs:
  sondear:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # Prueba el camino REAL: `descubrir.fichas_de` con el proxy encendido,
      # que es exactamente lo que corre en producción. No sirve probar solo
      # que el Worker contesta — hay que ver que Héctor saque fichas.
      - name: Descubrir por el proxy (paris y easy)
        env:
          HECTOR_PROXY_URL: https://hector-proxy-tiendas.contacto-e95.workers.dev
          HECTOR_PROXY_TOKEN: ${{ secrets.HECTOR_PROXY_TOKEN }}
        run: |
          python - <<'PY'
          import sys
          sys.stdout.reconfigure(encoding="utf-8")
          import descubrir
          print("proxy configurado:", bool(descubrir.PROXY_URL and descubrir.PROXY_TOKEN))
          for dom in ("paris.cl", "easy.cl"):
              try:
                  urls = descubrir.fichas_de(dom, tope=60)
                  print("%-10s %d fichas" % (dom, len(urls)))
                  for u in urls[:3]:
                      print("     ", u[:100])
              except Exception as e:
                  print("%-10s ERROR %s" % (dom, str(e)[:120]))
          PY

      # Lee FICHAS REALES de a una, con pausa entre medio. Es la prueba que
      # separa "nos bloquean" de "se ahogan bajo carga" — la misma que en el
      # §6 de la bitácora del 11-ago demostró que spdigital no estaba
      # bloqueada: 18 de 20 URLs "fallidas" leyeron bien de a una.
      #
      # Si de a una responde 200, el problema es el RITMO y se arregla en
      # RITMO_SEGURO. Si de a una ya responde 403, bajar el ritmo no sirve
      # de nada y hay que ir por el proxy.
      - name: Leer fichas de a una (¿bloqueo o carga?)
        env:
          DOMINIOS: ${{ inputs.dominios }}
        run: |
          python - <<'PY'
          import os
          import sys
          import time
          sys.stdout.reconfigure(encoding="utf-8")
          import descubrir
          from curl_cffi import requests as cffi

          try:
              ip = cffi.get("https://api.ipify.org", timeout=20).text
          except Exception as e:
              ip = "? (%s)" % str(e)[:40]
          print("IP de salida del runner:", ip, "\n")

          doms = [d.strip() for d in (os.environ.get("DOMINIOS") or "").split(",")
                  if d.strip()]

          for dom in doms:
              print("=" * 66)
              print(dom)
              print("=" * 66)
              try:
                  urls = descubrir.fichas_de(dom, tope=40)
              except Exception as e:
                  print("  no se pudieron descubrir fichas: %s\n" % str(e)[:120])
                  continue
              print("  fichas descubiertas: %d" % len(urls))
              muestra = urls[:10]
              if not muestra:
                  print()
                  continue

              codigos = {}
              for u in muestra:
                  try:
                      r = cffi.get(u, impersonate="chrome", timeout=30,
                                   headers={"Accept-Language": "es-CL,es;q=0.9"})
                      codigos[r.status_code] = codigos.get(r.status_code, 0) + 1
                      print("    HTTP %-4s %6d KB  %s"
                            % (r.status_code, len(r.content or b"") // 1024,
                               u[:78]))
                  except Exception as e:
                      codigos["ERR"] = codigos.get("ERR", 0) + 1
                      print("    ERROR %-38s %s" % (str(e)[:38], u[:60]))
                  time.sleep(1.2)   # de a una y sin apuro: ese es el punto

              ok = codigos.get(200, 0)
              print("\n  resumen: %s" % codigos)
              if ok == len(muestra):
                  print("  → LEE PERFECTO de a una. El problema es el RITMO, "
                        "no un bloqueo:\n    bajar su valor en RITMO_SEGURO.\n")
              elif ok == 0:
                  print("  → NO lee ni de a una. Es BLOQUEO: bajar el ritmo no "
                        "sirve,\n    hay que pasarla por el proxy.\n")
              else:
                  print("  → mixto (%d/%d): mirar los códigos de arriba.\n"
                        % (ok, len(muestra)))
          PY
