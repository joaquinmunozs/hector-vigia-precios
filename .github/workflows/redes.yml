name: Rat.IA — publicar en Instagram y Facebook

# Tres veces al día, en horario de Chile (UTC-4): 09:10, 14:10 y 20:10 local.
# Los minutos NO son :00 a propósito — el cron de GitHub se congestiona en la
# hora en punto y ahí los atrasos son de 30 min o más.
#
# Por qué tres y no una por hallazgo: publicar cada error de precio al
# instante llenaría el feed de 20 posts un día y ninguno al siguiente, y
# Instagram castiga ese patrón. Tres tandas con tope de piezas dan un feed
# parejo. El aviso INMEDIATO sigue siendo Telegram, que es lo que se cobra.
on:
  schedule:
    - cron: "10 13 * * *"
    - cron: "10 18 * * *"
    - cron: "10 0 * * *"
  workflow_dispatch:
    inputs:
      probar:
        description: "Armar los posts e imprimirlos SIN publicar"
        type: boolean
        default: true
      tope:
        description: "Máximo de piezas a publicar"
        default: "2"

# Este workflow NO comparte grupo de concurrencia con hector.yml a propósito.
# `hector.yml` usa `hector-barrida` y sus corridas ya se encolan entre ellas;
# meter esto en el mismo grupo lo dejaría esperando horas detrás de una
# barrida de 3,4 h y las tandas de publicación se perderían.
concurrency:
  group: ratia-redes
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read       # para encontrar el artifact de la barrida

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # SOLO LEE la base. No la vuelve a subir como artifact: si lo hiciera,
      # sobrescribiría el estado de la barrida en curso con una copia vieja
      # — mismo criterio que analisis-semanal.yml.
      #
      # CONSECUENCIA A TENER PRESENTE: como no se sube, la tabla
      # `publicaciones` que escribe redes.py NO persiste entre corridas. El
      # anti-repetido real dentro de una tanda es el tope de piezas; entre
      # tandas, la ventana de horas. Cuando haya volumen de verdad conviene
      # mover `publicaciones` a un KV o a Supabase, que sí persisten.
      - name: Encontrar la última barrida
        id: barrida
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh api "repos/${{ github.repository }}/actions/workflows/hector.yml/runs?per_page=10" \
            --jq "[.workflow_runs[] | select(.conclusion == \"success\")][0].id // \"\"")
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Barrida: ${RUN_ID:-ninguna}"

      - name: Traer la base
        if: steps.barrida.outputs.run_id != ''
        uses: dawidd6/action-download-artifact@v6
        with:
          name: precios-db
          run_id: ${{ steps.barrida.outputs.run_id }}
          if_no_artifact_found: fail

      - name: Verificar que hay base
        run: |
          test -f precios.db || { echo "no se recuperó precios.db"; exit 1; }
          echo "base: $(du -h precios.db | cut -f1)"

      - name: Publicar
        env:
          # Higgsfield: genera el creativo. Sin estas dos, redes.py no
          # publica nada y solo imprime — es el modo seguro por defecto.
          HF_API_KEY_ID: ${{ secrets.HF_API_KEY_ID }}
          HF_API_KEY_SECRET: ${{ secrets.HF_API_KEY_SECRET }}
          # Meta: token de SYSTEM USER de Business Manager, no de usuario.
          # Los de usuario vencen a los 60 días y la publicación se cortaría
          # sola sin ningún error visible hasta que alguien mire el feed.
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          RATIA_CUENTA_IG: ${{ vars.RATIA_CUENTA_IG }}
        run: |
          python -u redes.py \
            --tope "${{ github.event.inputs.tope || '2' }}" \
            ${{ github.event.inputs.probar == 'true' && '--probar' || '' }}
